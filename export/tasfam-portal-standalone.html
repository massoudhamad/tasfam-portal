document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

p:12px; padding:28px; background:#fff; border:1px solid #DFD8C9; border-radius:10px; text-decoration:none; color:#10333F\" style-hover=\"border-color:#0F766E; transform:translateY(-2px)\">\n          <span aria-hidden=\"true\" style=\"width:38px; height:3px; background:#0F766E\"><\u002Fspan>\n          <h3 style=\"font-size:21px; font-weight:600\">\n            <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Tenders &amp; procurement<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Zabuni na manunuzi<\u002Fspan><\u002Fsc-if>\n          <\u002Fh3>\n          <p style=\"font-size:16px; line-height:1.55; color:#4A5C63\">\n            <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Open notices, awarded contracts and the procurement plan.<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ sw }}\"><span>Matangazo, mikataba iliyotolewa na mpango wa manunuzi.<\u002Fspan><\u002Fsc-if>\n          <\u002Fp>\n        <\u002Fa>\n        <a href=\"#\" sc-camel-on-click=\"{{ goSafeguards }}\" style=\"display:flex; flex-direction:column; gap:12px; padding:28px; background:#fff; border:1px solid #DFD8C9; border-radius:10px; text-decoration:none; color:#10333F\" style-hover=\"border-color:#0F766E; transform:translateY(-2px)\">\n          <span aria-hidden=\"true\" style=\"width:38px; height:3px; background:#0F766E\"><\u002Fspan>\n          <h3 style=\"font-size:21px; font-weight:600\">\n            <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Safeguards &amp; grievances<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Ulinzi na malalamiko<\u002Fspan><\u002Fsc-if>\n          <\u002Fh3>\n          <p style=\"font-size:16px; line-height:1.55; color:#4A5C63\">\n            <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>ESMF, RPF and SEP disclosures, plus the grievance redress mechanism.<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ sw }}\"><span>Nyaraka za ESMF, RPF na SEP, pamoja na mfumo wa kushughulikia malalamiko.<\u002Fspan><\u002Fsc-if>\n          <\u002Fp>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#0A2530; color:#fff\">\n      <div style=\"max-width:1200px; margin:0 auto; padding:0 24px\">\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap:0; align-items:stretch\">\n          <div style=\"min-height:320px; background-image:url('https://tasfam.blueeconomysmz.go.tz/api/uploads/1774880794269-5L0A4120.JPG'); background-size:cover; background-position:center; background-color:#123B44\"><\u002Fdiv>\n          <div style=\"padding:56px 0 56px 44px; display:flex; flex-direction:column; gap:18px; justify-content:center\">\n            <span style=\"font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#8FD0C6; font-weight:700\">\n              <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Story from the field<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Hadithi kutoka uwandani<\u002Fspan><\u002Fsc-if>\n            <\u002Fspan>\n            <h2 style=\"font-size:clamp(24px, 3vw, 34px); line-height:1.2; font-weight:600; max-width:24ch\">\n              <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>“We stopped guessing where the fish were.”<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ sw }}\"><span>“Tuliacha kubahatisha samaki walipo.”<\u002Fspan><\u002Fsc-if>\n            <\u002Fh2>\n            <p style=\"font-size:17px; line-height:1.6; color:#DCE9EA; max-width:46ch\">\n              <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Mwanaidi Juma, seaweed farmer, Paje — Unguja South. Deep-water tubular lines raised her harvest from 0.6 to 1.9 tonnes a season.<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ sw }}\"><span>Mwanaidi Juma, mkulima wa mwani, Paje — Kusini Unguja. Mistari ya maji ya kina iliongeza mavuno kutoka tani 0.6 hadi 1.9 kwa msimu.<\u002Fspan><\u002Fsc-if>\n            <\u002Fp>\n            <a href=\"#\" sc-camel-on-click=\"{{ goStory }}\" style=\"min-height:52px; display:inline-flex; align-items:center; align-self:flex-start; padding:0 24px; border-radius:6px; background:#fff; color:#0A2530; text-decoration:none; font-weight:700; font-size:16px\" style-hover=\"background:#8FD0C6\">\n              <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Read her story<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Soma hadithi yake<\u002Fspan><\u002Fsc-if>\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section aria-label=\"Impact at scale\" style=\"background:#fff; border-top:1px solid #DFD8C9; border-bottom:1px solid #DFD8C9\">\n      <div style=\"max-width:1200px; margin:0 auto; padding:64px 24px\">\n        <div style=\"display:flex; flex-direction:column; gap:10px; max-width:60ch; margin-bottom:26px\">\n          <span style=\"font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#0F766E; font-weight:700\">\n            <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Impact at scale<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Athari kwa upana<\u002Fspan><\u002Fsc-if>\n          <\u002Fspan>\n          <h2 style=\"font-size:clamp(24px, 3vw, 34px); font-weight:600; line-height:1.2\">\n            <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Outcomes tracked across four lenses<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ sw }}\"><span>Matokeo yanayofuatiliwa kwa mitazamo minne<\u002Fspan><\u002Fsc-if>\n          <\u002Fh2>\n        <\u002Fdiv>\n        <div role=\"tablist\" aria-label=\"Impact lenses\" style=\"display:flex; flex-wrap:wrap; gap:8px; border-bottom:1px solid #DFD8C9; padding-bottom:0; margin-bottom:26px\">\n          <button type=\"button\" role=\"tab\" aria-selected=\"{{ lensPeo :uppercase; color:#0F766E\">\n              <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Seaweed · Paje, Unguja South<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ sw }}\"><span>Mwani · Paje, Kusini Unguja<\u002Fspan><\u002Fsc-if>\n            <\u002Fspan>\n            <h3 style=\"font-size:21px; font-weight:600; line-height:1.3\">\n              <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Mwanaidi Juma tripled her seaweed harvest<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ sw }}\"><span>Mwanaidi Juma aliongeza mavuno ya mwani mara tatu<\u002Fspan><\u002Fsc-if>\n            <\u002Fh3>\n            <p style=\"font-size:15.5px; color:#4A5C63; line-height:1.55\">\n              <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Deep-water tubular lines moved her farm past the warming shallows.<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ sw }}\"><span>Mistari ya maji ya kina ilihamisha shamba lake kutoka maji mafupi yenye joto.<\u002Fspan><\u002Fsc-if>\n            <\u002Fp>\n            <span style=\"font-size:15px; font-weight:700; color:#0F766E; margin-top:4px\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Read the story →<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Soma hadithi →<\u002Fspan><\u002Fsc-if><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fa>\n        <a href=\"#\" style=\"display:flex; flex-direction:column; background:#fff; border:1px solid #DFD8C9; border-radius:10px; overflow:hidden; text-decoration:none; color:#10333F\" style-hover=\"border-color:#0F766E\">\n          <div style=\"height:210px; background:#1B4A54; display:flex; align-items:flex-end; padding:16px\"><span style=\"font-size:13px; color:#BFD8D4; background:rgba(10,37,48,.6); padding:6px 10px; border-radius:4px\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Photo placeholder — fisher at Mkokotoni landing site<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Nafasi ya picha — mvuvi katika mwalo wa Mkokotoni<\u002Fspan><\u002Fsc-if><\u002Fspan><\u002Fdiv>\n          <div style=\"padding:24px; display:flex; flex-direction:column; gap:10px\">\n            <span style=\"font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#0F766E\">\n              <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Fisheries · Mkokotoni, Unguja North<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ sw }}\"><span>Uvuvi · Mkokotoni, Kaskazini Unguja<\u002Fspan><\u002Fsc-if>\n            <\u002Fspan>\n            <h3 style=\"font-size:21px; font-weight:600; line-height:1.3\">\n              <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Cold storage ended Salim’s afternoon losses<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ sw }}\"><span>Chumba cha ubaridi kilimaliza hasara za Salim za mchana<\u002Fspan><\u002Fsc-if>\n            <\u002Fh3>\n            <p style=\"font-size:15.5px; color:#4A5C63; line-height:1.55\">\n              <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Spoilage at the landing site fell from a third of the catch to under five per cent.<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ sw }}\"><span>Uharibifu wa samaki katika mwalo ulipungua kutoka theluthi moja hadi chini ya asilimia tano.<\u002Fspan><\u002Fsc-if>\n            <\u002Fp>\n            <span style=\"font-size:15px; font-weight:700; color:#0F766E; margin-top:4px\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Read the story →<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Soma hadithi →<\u002Fspan><\u002Fsc-if><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fa>\n        <a href=\"#\" style=\"display:flex; flex-direction:column; background:#fff; border:1px solid #DFD8C9; border-radius:10px; overflow:hidden; text-decoration:none; color:#10333F\" style-hover=\"border-color:#0F766E\">\n          <div style=\"height:210px; background:#1B4A54; display:flex; align-items:flex-end; padding:16px\"><span style=\"font-size:13px; color:#BFD8D4; background:rgba(10,37,48,.6); padding:6px 10px; border-radius:4px\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Photo placeholder — cage farming group, Pemba<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Nafasi ya picha — kikundi cha ufugaji kwa vizimba, Pemba<\u002Fspan><\u002Fsc-if><\u002Fspan><\u002Fdiv>\n          <div style=\"padding:24px; display:flex; flex-direction:column; gap:10px\">\n            <span style=\"font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#0F766E\">\n              <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Aquaculture · Wete, Pemba North<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ sw }}\"><span>Ufugaji · Wete, Kaskazini Pemba<\u002Fspan><\u002Fsc-if>\n            <\u002Fspan>\n            <h3 style=\"font-size:21px; font-weight:600; line-height:1.3\">\n              <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>A women’s group took on cage fish farming<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ sw }}\"><span>Kikundi cha wanawake kilianza ufugaji wa samaki kwa vizimba<\u002Fspan><\u002Fsc-if>\n            <\u002Fh3>\n            <p style=\"font-size:15.5px; color:#4A5C63; line-height:1.55\">\n              <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Twenty-six members, two harvest cycles, first commercial sale in 2026.<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ sw }}\"><span>Wanachama ishirini na sita, mizunguko miwili ya mavuno, mauzo ya kwanza ya kibiashara mwaka 2026.<\u002Fspan><\u002Fsc-if>\n            <\u002Fp>\n            <span style=\"font-size:15px; font-weight:700; color:#0F766E; margin-top:4px\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Read the story →<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Soma hadithi →<\u002Fspan><\u002Fsc-if><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isStory }}\">\n  <div>\n    <div style=\"position:relative; background:#0A2530; color:#fff; min-height:420px; display:flex; align-items:flex-end\">\n      <div style=\"position:absolute; inset:0; background-image:url('https://tasfam.blueeconomysmz.go.tz/api/uploads/1774880794269-5L0A4120.JPG'); background-size:cover; background-position:center; opacity:.5\"><\u002Fdiv>\n      <div style=\"position:absolute; inset:0; background:linear-gradient(0deg, #0A2530 8%, rgba(10,37,48,.25) 100%)\"><\u002Fdiv>\n      <div style=\"position:relative; max-width:900px; margin:0 auto; padding:56px 24px 44px; width:100%; display:flex; flex-direction:column; gap:16px\">\n        <nav aria-label=\"Breadcrumb\" style=\"font-size:14px; color:#9FBCC2\">\n          <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"color:#9FBCC2\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Home<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Mwanzo<\u002Fspan><\u002Fsc-if><\u002Fa> <span aria-hidden=\"true\">/<\u002Fspan> <a href=\"#\" sc-camel-on-click=\"{{ goStories }}\" style=\"color:#9FBCC2\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Stories<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Hadithi<\u002Fspan><\u002Fsc-if><\u002Fa> <span aria-hidden=\"true\">/<\u002Fspan> <span style=\"color:#fff\">Mwanaidi Juma<\u002Fspan>\n        <\u002Fnav>\n        <h1 style=\"font-size:clamp(28px, 4.4vw, 46px); font-weight:700; line-height:1.12; max-width:24ch\">\n          <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>“The sea got warmer. We had to farm deeper.”<\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ sw }}\"><span>“Bahari ilipata joto. Tulilazimika kulima kwa kina.”<\u002Fspan><\u002Fsc-if>\n        <\u002Fh1>\n        <p style=\"font-size:17px; color:#DCE9EA\">\n          <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Mwanaidi Juma · seaweed farmer · Paje, Unguja South<\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ sw }}\"><span>Mwanaidi Juma · mkulima wa mwani · Paje, Kusini Unguja<\u002Fspan><\u002Fsc-if>\n        <\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"max-width:900px; margin:0 auto; padding:0 24px\">\n      <dl style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap:0; background:#fff; border:1px solid #DFD8C9; border-radius:10px; margin:-26px 0 0; position:relative; overflow:hidden\">\n        <div style=\"padding:20px 24px; border-bottom:1px solid #EFEADF\">\n          <dt style=\"font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#5C6B72; margin-bottom:6px\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Location<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Eneo<\u002Fspan><\u002Fsc-if><\u002Fdt>\n          <dd style=\"margin:0; font-size:16.5px; font-weight:600\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Paje, Unguja South<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Paje, Kusini Unguja<\u002Fspan><\u002Fsc-if><\u002Fdd>\n        <\u002Fdiv>\n        <div style=\"padding:20px 24px; border-bottom:1px solid #EFEADF\">\n          <dt style=\"font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#5C6B72; margin-bottom:6px\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Support received<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Msaada uliopatikana<\u002Fspan><\u002Fsc-if><\u002Fdt>\n          <dd style=\"margin:0; font-size:16.5px; font-weight:600\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Deep-water lines, boat access, training<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Mistari ya maji ya kina, matumizi ya mashua, mafunzo<\u002Fspan><\u002Fsc-if><\u002Fdd>\n        <\u002Fdiv>\n        <div style=\"padding:20px 24px; border-bottom:1px solid #EFEADF\">\n          <dt style=\"font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#5C6B72; margin-bottom:6px\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Component<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Kipengele<\u002Fspan><\u002Fsc-if><\u002Fdt>\n          <dd style=\"margin:0; font-size:16.5px; font-weight:600\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>3 — Aquaculture &amp; value chains<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>3 — Ufugaji na minyororo ya thamani<\u002Fspan><\u002Fsc-if><\u002Fdd>\n        <\u002Fdiv>\n      <\u002Fdl>\n    <\u002Fdiv>\n\n    <section style=\"max-width:900px; margin:0 auto; padding:40px 24px 0\">\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap:16px\">\n        <div style=\"background:#fff; border:1px solid #DFD8C9; border-radius:10px; padding:24px\">\n          <span style=\"font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#5C6B72\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Before — 2024<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Kabla — 2024<\u002Fspan><\u002Fsc-if><\u002Fspan>\n          <p style=\"font-family:Bitter,serif; font-size:30px; font-weight:700; margin:10px 0 4px\">0.6 t<\u002Fp>\n          <p style=\"font-size:15px; color:#4A5C63; line-height:1.5\">\n            <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Harvest per season from shallow-water pegs, with repeated die-off.<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ sw }}\"><span>Mavuno kwa msimu kutoka vigingi vya maji mafupi, pamoja na kufa kwa mazao mara kwa mara.<\u002Fspan><\u002Fsc-if>\n          <\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#0F766E; color:#fff; border:1px solid #0F766E; border-radius:10px; padding:24px\">\n          <span style=\"font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#BFEDE6\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>After — 2026<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Baada — 2026<\u002Fspan><\u002Fsc-if><\u002Fspan>\n          <p style=\"font-family:Bitter,serif; font-size:30px; font-weight:700; margin:10px 0 4px\">1.9 t<\u002Fp>\n          <p style=\"font-size:15px; color:#DBF3EF; line-height:1.5\">\n            <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Harvest per season on tubular deep-water lines, two cycles a year.<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ sw }}\"><span>Mavuno kwa msimu kwa mistari ya maji ya kina, mizunguko miwili kwa mwaka.<\u002Fspan><\u002Fsc-if>\n          <\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff; border:1px solid #DFD8C9; border-radius:10px; padding:24px\">\n          <span style=\"font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#5C6B72\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Household income<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Kipato cha kaya<\u002Fspan><\u002Fsc-if><\u002Fspan>\n          <p style=\"font-family:Bitter,serif; font-size:30px; font-weight:700; margin:10px 0 4px\">+2.4×<\u002Fp>\n          <p style=\"font-size:15px; color:#4A5C63; line-height:1.5\">\n            <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Reported by the Paje seaweed group, verified at the cooperative.<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ sw }}\"><span>Imeripotiwa na kikundi cha mwani cha Paje, imethibitishwa na chama cha ushirika.<\u002Fspan><\u002Fsc-if>\n          <\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <article style=\"max-width:720px; margin:0 auto; padding:44px 24px 20px; display:flex; flex-direction:column; gap:22px\">\n      <p style=\"font-size:19.5px; line-height:1.65; color:#22424C\">\n        <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>For eleven years Mwanaidi Juma farmed seaweed in the shallows off Paje, walking out at low tide to tie cuttings between wooden pegs. From about 2019 the crop began to fail in the hot months: the water in the lagoon grew too warm, the seaweed bleached and broke apart before harvest.<\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ sw }}\"><span>Kwa miaka kumi na moja Mwanaidi Juma alilima mwani katika maji mafupi ya Paje, akitembea maji yanapopwa kufunga miche kati ya vigingi. Kuanzia mwaka 2019 mazao yalianza kuharibika miezi ya joto: maji ya rasi yalipata joto kupita kiasi, mwani ukabadilika rangi na kuvunjika kabla ya mavuno.<\u002Fspan><\u002Fsc-if>\n      <\u002Fp>\n      <p style=\"font-size:17.5px; line-height:1.7; color:#3A5158\">\n        <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>In 2025 her group was one of forty-six selected under the project’s aquaculture component. They received tubular net lines designed for deeper water, shared access to a boat, swimming and safety training, and two seasons of extension support from the Department of Fisheries Development and Aquaculture.<\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ sw }}\"><span>Mwaka 2025 kikundi chake kilikuwa mojawapo ya vikundi arobaini na sita vilivyochaguliwa chini ya kipengele cha ufugaji. Walipata mistari ya nyavu kwa maji ya kina, matumizi ya pamoja ya mashua, mafunzo ya kuogelea na usalama, na misimu miwili ya ushauri wa kitaalamu.<\u002Fspan><\u002Fsc-if>\n      <\u002Fp>\n      <blockquote style=\"margin:6px 0; padding:24px 28px; background:#fff; border-left:4px solid #0F766E; border-radius:0 8px 8px 0\">\n        <p style=\"font-family:Bitter,serif; font-size:22px; line-height:1.45; font-weight:500\">\n          <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>“The first time I swam out to the lines I was afraid. Now I go twice a week and I know what the crop will be before I pull it up.”<\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ sw }}\"><span>“Mara ya kwanza kuogelea hadi mistarini niliogopa. Sasa naenda mara mbili kwa wiki na najua mazao yatakuwa vipi kabla ya kuyavuta.”<\u002Fspan><\u002Fsc-if>\n        <\u002Fp>\n      <\u002Fblockquote>\n      <p style=\"font-size:17.5px; line-height:1.7; color:#3A5158\">\n        <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Two harvests later her seasonal yield had risen from 0.6 to 1.9 tonnes of dried seaweed. The group now sells through a single aggregated contract rather than to individual buyers at the roadside, and holds a share of the receipts in a joint account for line replacement.<\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ sw }}\"><span>Baada ya mavuno mawili mavuno yake ya msimu yalipanda kutoka tani 0.6 hadi 1.9 za mwani mkavu. Kikundi kinauza kwa mkataba mmoja wa pamoja badala ya wanunuzi wa barabarani, na huweka sehemu ya mapato katika akaunti ya pamoja kwa ajili ya kubadilisha mistari.<\u002Fspan><\u002Fsc-if>\n      <\u002Fp>\n    <\u002Farticle>\n\n    <section style=\"max-width:900px; margin:0 auto; padding:20px 24px 80px\">\n      <div style=\"background:#10333F; border-radius:12px; overflow:hidden\">\n        <div style=\"aspect-ratio:16/9; background:#123B44; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:24px; text-align:center\">\n          <span aria-hidden=\"true\" style=\"width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px\">▶<\u002Fspan>\n          <span style=\"color:#BFD8D4; font-size:15px; max-width:40ch; line-height:1.5\">\n            <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Video placeholder — 90-second field film, with captions and a Kiswahili subtitle track.<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ sw }}\"><span>Nafasi ya video — filamu ya sekunde 90 kutoka uwandani, yenye manukuu na tafsiri ya Kiswahili.<\u002Fspan><\u002Fsc-if>\n          <\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:12px; margin-top:26px\">\n        <a href=\"#\" sc-camel-on-click=\"{{ goStories }}\" style=\"min-height:52px; display:inline-flex; align-items:center; padding:0 22px; border-radius:6px; background:#10333F; color:#fff; text-decoration:none; font-weight:700; font-size:16px\" style-hover=\"background:#0F766E\">\n          <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>More stories<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Hadithi zaidi<\u002Fspan><\u002Fsc-if>\n        <\u002Fa>\n        <a href=\"map.html\" style=\"min-height:52px; display:inline-flex; align-items:center; padding:0 22px; border-radius:6px; border:1.5px solid #C3BBA8; color:#10333F; text-decoration:none; font-weight:700; font-size:16px\" style-hover=\"border-color:#0F766E\">\n          <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>See Paje on the map<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Tazama Paje kwenye ramani<\u002Fspan><\u002Fsc-if>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isOcean }}\">\n  <div>\n    <div style=\"position:relative; background:#0A2530; color:#fff; overflow:hidden\">\n      <div style=\"position:absolute; inset:0; background-image:url('https://tasfam.blueeconomysmz.go.tz/api/uploads/1774879247863-5L0A4034.png'); background-size:cover; background-position:center; opacity:.35\"><\u002Fdiv>\n      <div style=\"position:absolute; inset:0; background:linear-gradient(90deg, #0A2530 0%, rgba(10,37,48,.7) 100%)\"><\u002Fdiv>\n      <div style=\"position:relative; max-width:1200px; margin:0 auto; padding:56px 24px 52px; display:flex; flex-direction:column; gap:14px\">\n        <nav aria-label=\"Breadcrumb\" style=\"font-size:14px; color:#9FBCC2\">\n          <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"color:#9FBCC2\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Home<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Mwanzo<\u002Fspan><\u002Fsc-if><\u002Fa> <span aria-hidden=\"true\">/<\u002Fspan> <span style=\"color:#fff\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Our Ocean<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Bahari Yetu<\u002Fspan><\u002Fsc-if><\u002Fspan>\n        <\u002Fnav>\n        <h1 style=\"font-size:clamp(28px, 4vw, 44px); font-weight:700; line-height:1.14; max-width:22ch\">\n          <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>An ocean that feeds and employs the coast<\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ sw }}\"><span>Bahari inayolisha na kutoa ajira pwani<\u002Fspan><\u002Fsc-if>\n        <\u002Fh1>\n        <p style=\"font-size:18.5px; line-height:1.6; max-width:62ch; color:#DCE9EA\">\n          <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Tanzania’s marine waters run from Tanga to Mtwara and around Unguja and Pemba. Fisheries are a food source, a household income and a growing part of the blue economy.<\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ sw }}\"><span>Maji ya bahari ya Tanzania yanaenea kutoka Tanga hadi Mtwara na kuzunguka Unguja na Pemba. Uvuvi ni chakula, kipato cha kaya na sehemu inayokua ya uchumi wa buluu.<\u002Fspan><\u002Fsc-if>\n        <\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <section style=\"max-width:1200px; margin:0 auto; padding:48px 24px 12px\">\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(min(210px, 100%), 1fr)); gap:26px\">\n        <div style=\"display:flex; flex-direction:column; gap:6px\">\n          <span style=\"font-family:Bitter,serif; font-size:32px; font-weight:700; color:#0F766E\">1,424 km<\u002Fspan>\n          <span style=\"font-size:15px; color:#5C6B72; line-height:1.45\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Mainland and island coastline<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Ukanda wa pwani wa Bara na visiwa<\u002Fspan><\u002Fsc-if><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:6px\">\n          <span style=\"font-family:Bitter,serif; font-size:32px; font-weight:700; color:#0F766E\">223,000 km²<\u002Fspan>\n          <span style=\"font-size:15px; color:#5C6B72; line-height:1.45\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Exclusive Economic Zone<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Ukanda wa Kiuchumi wa Pekee<\u002Fspan><\u002Fsc-if><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:6px\">\n          <span style=\"font-family:Bitter,serif; font-size:32px; font-weight:700; color:#0F766E\">~4.5%<\u002Fspan>\n          <span style=\"font-size:15px; color:#5C6B72; line-height:1.45\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Share of national GDP from fisheries<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Mchango wa uvuvi katika pato la taifa<\u002Fspan><\u002Fsc-if><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:6px\">\n          <span style=\"font-family:Bitter,serif; font-size:32px; font-weight:700; color:#0F766E\">4.5M<\u002Fspan>\n          <span style=\"font-size:15px; color:#5C6B72; line-height:1.45\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>People dependent on the sector<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Watu wanaotegemea sekta hii<\u002Fspan><\u002Fsc-if><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:13.5px; color:#8A6A2F; background:#FDF6E3; border:1px solid #E8D9AE; border-radius:6px; padding:10px 14px; display:inline-block; margin-top:26px\">\n        <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Figures require confirmation against official national statistics before publication.<\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ sw }}\"><span>Takwimu zinahitaji kuthibitishwa na takwimu rasmi za kitaifa kabla ya kuchapishwa.<\u002Fspan><\u002Fsc-if>\n      <\u002Fp>\n    <\u002Fsection>\n    <section style=\"max-width:1200px; margin:0 auto; padding:36px 24px 72px\">\n      <h2 style=\"font-size:26px; font-weight:600; margin-bottom:22px\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>What is at stake<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Hatari zilizopo<\u002Fspan><\u002Fsc-if><\u002Fh2>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(min(270px, 100%), 1fr)); gap:20px\">\n        <div style=\"background:#fff; border:1px solid #DFD8C9; border-radius:10px; padding:26px; display:flex; flex-direction:column; gap:10px\">\n          <h3 style=\"font-size:19px; font-weight:600\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Pressure on stocks<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Msongo kwa rasilimali za samaki<\u002Fspan><\u002Fsc-if><\u002Fh3>\n          <p style=\"font-size:16px; line-height:1.55; color:#4A5C63\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Priority stocks are fished at or beyond sustainable levels in several districts, with weak catch data to manage against.<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Rasilimali za kipaumbele zinavuliwa kwa kiwango cha juu au kuzidi katika wilaya kadhaa, na takwimu za mavuno ni hafifu.<\u002Fspan><\u002Fsc-if><\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff; border:1px solid #DFD8C9; border-radius:10px; padding:26px; display:flex; flex-direction:column; gap:10px\">\n          <h3 style=\"font-size:19px; font-weight:600\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Warming and habitat loss<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Ongezeko la joto na uharibifu wa mazalia<\u002Fspan><\u002Fsc-if><\u002Fh3>\n          <p style=\"font-size:16px; line-height:1.55; color:#4A5C63\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Rising lagoon temperatures are pushing seaweed farming into deeper water and stressing reef habitats.<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Kupanda kwa joto la rasi kunasukuma ukulima wa mwani kwenye maji ya kina na kuathiri matumbawe.<\u002Fspan><\u002Fsc-if><\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff; border:1px solid #DFD8C9; border-radius:10px; padding:26px; display:flex; flex-direction:column; gap:10px\">\n          <h3 style=\"font-size:19px; font-weight:600\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Post-harvest losses<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Hasara baada ya mavuno<\u002Fspan><\u002Fsc-if><\u002Fh3>\n          <p style=\"font-size:16px; line-height:1.55; color:#4A5C63\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Without ice and cold storage at landing sites, a large share of the catch loses value before it reaches a buyer.<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Bila barafu na vyumba vya ubaridi mialoni, sehemu kubwa ya samaki hupoteza thamani kabla ya kufika kwa mnunuzi.<\u002Fspan><\u002Fsc-if><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"map.html\" style=\"min-height:52px; display:inline-flex; align-items:center; margin-top:28px; padding:0 24px; border-radius:6px; background:#10333F; color:#fff; text-decoration:none; font-weight:700; font-size:16px\" style-hover=\"background:#0F766E\">\n        <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>See where the project works<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Tazama mradi unapofanya kazi<\u002Fspan><\u002Fsc-if>\n      <\u002Fa>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAbout }}\">\n  <div>\n    <div style=\"background:#10333F; color:#fff\">\n      <div style=\"max-width:1200px; margin:0 auto; padding:48px 24px 44px; display:flex; flex-direction:column; gap:14px\">\n        <nav aria-label=\"Breadcrumb\" style=\"font-size:14px; color:#9FBCC2\">\n          <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"color:#9FBCC2\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Home<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Mwanzo<\u002Fspan><\u002Fsc-if><\u002Fa> <span aria-hidden=\"true\">/<\u002Fspan> <span style=\"color:#fff\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>About TASFAM<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Kuhusu TASFAM<\u002Fspan><\u002Fsc-if><\u002Fspan>\n        <\u002Fnav>\n        <h1 style=\"font-size:clamp(28px, 4vw, 42px); font-weight:700; line-height:1.15\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>About the project<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Kuhusu mradi<\u002Fspan><\u002Fsc-if><\u002Fh1>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <section style=\"max-width:1200px; margin:0 auto; padding:48px 24px 8px; display:grid; grid-template-columns:repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap:32px\">\n      <p style=\"font-size:19.5px; line-height:1.65; color:#22424C\">\n        <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>The Ministry of Livestock and Fisheries (Mainland) and the Ministry of Blue Economy and Fisheries (Zanzibar), through the Ministry of Finance, requested World Bank support for the Tanzania Scaling-up Sustainable Marine Fisheries and Aquaculture Management Project.<\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ sw }}\"><span>Wizara ya Mifugo na Uvuvi (Bara) na Wizara ya Uchumi wa Buluu na Uvuvi (Zanzibar), kupitia Wizara ya Fedha, ziliomba msaada wa Benki ya Dunia kwa Mradi wa Kuimarisha Usimamizi Endelevu wa Uvuvi wa Baharini na Ufugaji wa Viumbe vya Maji Tanzania.<\u002Fspan><\u002Fsc-if>\n      <\u002Fp>\n      <p style=\"font-size:17.5px; line-height:1.7; color:#3A5158\">\n        <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>The project development objective is to improve the management effectiveness of selected priority fisheries at regional, national and community level. It supports sustainable fisheries management, strengthens sector governance, and promotes shared growth by harnessing the value of coastal and marine fisheries to national economies.<\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ sw }}\"><span>Lengo la mradi ni kuboresha ufanisi wa usimamizi wa uvuvi wa kipaumbele katika ngazi za kikanda, kitaifa na kijamii. Unasaidia usimamizi endelevu wa uvuvi, kuimarisha utawala wa sekta, na kuchochea ukuaji shirikishi kwa kutumia thamani ya uvuvi wa pwani na bahari.<\u002Fspan><\u002Fsc-if>\n      <\u002Fp>\n    <\u002Fsection>\n    <section style=\"max-width:1200px; margin:0 auto; padding:26px 24px 72px\">\n      <h2 style=\"font-size:24px; font-weight:600; margin-bottom:20px\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Timeline and milestones<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Muda na hatua muhimu<\u002Fspan><\u002Fsc-if><\u002Fh2>\n      <ol style=\"list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0\">\n        <li style=\"display:flex; gap:20px; padding:20px 0; border-top:1px solid #DFD8C9\">\n          <span style=\"font-family:Bitter,serif; font-weight:700; font-size:19px; color:#0F766E; min-width:64px\">2024<\u002Fspan>\n          <span style=\"font-size:16.5px; line-height:1.55\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Project preparation and appraisal completed<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Maandalizi na uchambuzi wa mradi yamekamilika<\u002Fspan><\u002Fsc-if><\u002Fspan>\n        <\u002Fli>\n        <li style=\"display:flex; gap:20px; padding:20px 0; border-top:1px solid #DFD8C9\">\n          <span style=\"font-family:Bitter,serif; font-weight:700; font-size:19px; color:#0F766E; min-width:64px\">2025<\u002Fspan>\n          <span style=\"font-size:16.5px; line-height:1.55\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Effectiveness, project implementation units established, first landing-site works<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Mradi unaanza, vitengo vya utekelezaji vimeundwa, kazi za kwanza za mialo<\u002Fspan><\u002Fsc-if><\u002Fspan>\n        <\u002Fli>\n        <li style=\"display:flex; gap:20px; padding:20px 0; border-top:1px solid #DFD8C9; background:#EDF6F4\">\n          <span style=\"font-family:Bitter,serif; font-weight:700; font-size:19px; color:#0F766E; min-width:64px\">2026<\u002Fspan>\n          <span style=\"font-size:16.5px; line-height:1.55; font-weight:600\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Current phase — fisher registration at scale, SAMAKI data system, aquaculture rollout<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Hatua ya sasa — usajili mkubwa wa wavuvi, mfumo wa takwimu SAMAKI, upanuzi wa ufugaji<\u002Fspan><\u002Fsc-if><\u002Fspan>\n        <\u002Fli>\n        <li style=\"display:flex; gap:20px; padding:20px 0; border-top:1px solid #DFD8C9\">\n          <span style=\"font-family:Bitter,serif; font-weight:700; font-size:19px; color:#0F766E; min-width:64px\">2028<\u002Fspan>\n          <span style=\"font-size:16.5px; line-height:1.55\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Mid-term review<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Mapitio ya katikati ya mradi<\u002Fspan><\u002Fsc-if><\u002Fspan>\n        <\u002Fli>\n        <li style=\"display:flex; gap:20px; padding:20px 0; border-top:1px solid #DFD8C9; border-bottom:1px solid #DFD8C9\">\n          <span style=\"font-family:Bitter,serif; font-weight:700; font-size:19px; color:#0F766E; min-width:64px\">2030<\u002Fspan>\n          <span style=\"font-size:16.5px; line-height:1.55\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Project closing and completion reporting<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Kufunga mradi na taarifa ya kukamilika<\u002Fspan><\u002Fsc-if><\u002Fspan>\n        <\u002Fli>\n      <\u002Fol>\n      <p style=\"font-size:13.5px; color:#8A6A2F; background:#FDF6E3; border:1px solid #E8D9AE; border-radius:6px; padding:10px 14px; margin-top:22px; display:inline-block\">\n        <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Dates are indicative pending the signed project appraisal document.<\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ sw }}\"><span>Tarehe ni za awali hadi nyaraka rasmi za mradi zithibitishwe.<\u002Fspan><\u002Fsc-if>\n      <\u002Fp>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isComponents }}\">\n  <div>\n    <div style=\"background:#10333F; color:#fff\">\n      <div style=\"max-width:1200px; margin:0 auto; padding:48px 24px 44px; display:flex; flex-direction:column; gap:14px\">\n        <nav aria-label=\"Breadcrumb\" style=\"font-size:14px; color:#9FBCC2\">\n          <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"color:#9FBCC2\"><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Home<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Mwanzo<\u002Fspan><\u002Fsc-if><\u002Fa> <span aria-hidden=\"true\">/<\u002Fspan> <span style=\"color:#fff\"><sc-if value=\"{{ en }}\" hint-placehol  TASFAM. Haki zote zimehifadhiwa.<\u002Fspan><\u002Fsc-if><\u002Fspan>\n        <span><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\"><span>Financed by the World Bank · Government of Tanzania<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sw }}\"><span>Inafadhiliwa na Benki ya Dunia · Serikali ya Tanzania<\u002Fspan><\u002Fsc-if><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  state = { lang: \"en\", page: \"home\", menuOpen: false, wide: true, lens: \"people\", grmSent: false, grmAnon: false, grmRef: \"\" };\n\n  componentDidMount() {\n    this._resize = () => {\n      const w = window.innerWidth >= 1080;\n      if (w !== this.state.wide) this.setState({ wide: w });\n    };\n    this._key = (e) => { if (e.key === \"Escape\" && this.state.menuOpen) this.setState({ menuOpen: false }); };\n    this._resize();\n    window.addEventListener(\"resize\", this._resize);\n    window.addEventListener(\"keydown\", this._key);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener(\"resize\", this._resize);\n    window.removeEventListener(\"keydown\", this._key);\n  }\n\n  set(p) {\n    return (e) => {\n      if (e && e.preventDefault) e.preventDefault();\n      this.setState({ page: p, menuOpen: false });\n      if (typeof window !== \"undefined\") window.scrollTo(0, 0);\n    };\n  }\n\n  lensVals() {\n    const l = this.state.lens;\n    const out = {};\n    [[\"People\", \"people\"], [\"Ocean\", \"ocean\"], [\"Inst\", \"inst\"], [\"Jobs\", \"jobs\"]].forEach(([k, id]) => {\n      const on = l === id;\n      out[\"lens\" + k] = on;\n      out[\"lens\" + k + \"Sel\"] = on ? \"true\" : \"false\";\n      out[\"lens\" + k + \"Bar\"] = on ? \"#0F766E\" : \"transparent\";\n      out[\"lens\" + k + \"Fg\"] = on ? \"#0F766E\" : \"#4A5C63\";\n      out[\"setLens\" + k] = () => this.setState({ lens: id });\n    });\n    return out;\n  }\n\n  renderVals() {\n    const en = this.state.lang === \"en\";\n    const p = this.state.page;\n    const active = \"#0F766E\", idle = \"transparent\", onA = \"#FFFFFF\", onI = \"#CFE0E3\";\n    return {\n      en, sw: !en,\n      enPressed: en ? \"true\" : \"false\", swPressed: en ? \"false\" : \"true\",\n      enBg: en ? active : idle, enFg: en ? onA : onI,\n      swBg: en ? idle : active, swFg: en ? onI : onA,\n      setEn: () => this.setState({ lang: \"en\" }),\n      setSw: () => this.setState({ lang: \"sw\" }),\n      menuOpen: this.state.menuOpen,\n      menuExpanded: this.state.menuOpen ? \"true\" : \"false\",\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      wide: this.state.wide,\n      narrow: !this.state.wide,\n      barOcean: p === \"ocean\" ? \"#0F766E\" : \"transparent\",\n      barAbout: p === \"about\" ? \"#0F766E\" : \"transparent\",\n      barComponents: p === \"components\" ? \"#0F766E\" : \"transparent\",\n      barImpact: p === \"impact\" ? \"#0F766E\" : \"transparent\",\n      barStories: p === \"stories\" || p === \"story\" ? \"#0F766E\" : \"transparent\",\n      barPublications: p === \"publications\" ? \"#0F766E\" : \"transparent\",\n      barProcurement: p === \"procurement\" ? \"#0F766E\" : \"transparent\",\n      barSafeguards: p === \"safeguards\" || p === \"grm\" ? \"#0F766E\" : \"transparent\",\n      barContact: p === \"contact\" ? \"#0F766E\" : \"transparent\",\n      isHome: p === \"home\",\n      isImpact: p === \"impact\",\n      isStories: p === \"stories\",\n      isStory: p === \"story\",\n      isOcean: p === \"ocean\",\n      isAbout: p === \"about\",\n      isComponents: p === \"components\",\n      isPublications: p === \"publications\",\n      isProcurement: p === \"procurement\",\n      isSafeguards: p === \"safeguards\",\n      isPartners: p === \"partners\",\n      isContact: p === \"contact\",\n      curHome: p === \"home\" ? \"page\" : undefined,\n      curImpact: p === \"impact\" ? \"page\" : undefined,\n      curStories: p === \"stories\" || p === \"story\" ? \"page\" : undefined,\n      curOcean: p === \"ocean\" ? \"page\" : undefined,\n      curAbout: p === \"about\" ? \"page\" : undefined,\n      curComponents: p === \"components\" ? \"page\" : undefined,\n      curPublications: p === \"publications\" ? \"page\" : undefined,\n      curProcurement: p === \"procurement\" ? \"page\" : undefined,\n      curSafeguards: p === \"safeguards\" ? \"page\" : undefined,\n      curPartners: p === \"partners\" ? \"page\" : undefined,\n      curContact: p === \"contact\" ? \"page\" : undefined,\n      goHome: this.set(\"home\"),\n      goImpact: this.set(\"impact\"),\n      goStories: this.set(\"stories\"),\n      goStory: this.set(\"story\"),\n      goOcean: this.set(\"ocean\"),\n      goAbout: this.set(\"about\"),\n      goComponents: this.set(\"components\"),\n      goPublications: this.set(\"publications\"),\n      goProcurement: this.set(\"procurement\"),\n      goSafeguards: this.set(\"safeguards\"),\n      goPartners: this.set(\"partners\"),\n      goContact: this.set(\"contact\"),\n      goGrm: this.set(\"grm\"),\n      isGrm: p === \"grm\",\n      curGrm: p === \"grm\" ? \"page\" : undefined,\n      grmSent: this.state.grmSent,\n      grmForm: !this.state.grmSent,\n      grmRef: this.state.grmRef,\n      grmAnon: this.state.grmAnon,\n      grmNamed: !this.state.grmAnon,\n      grmSetAnon: () => this.setState({ grmAnon: true }),\n      grmSetNamed: () => this.setState({ grmAnon: false }),\n      grmReset: () => this.setState({ grmSent: false }),\n      grmSubmit: (e) => {\n        if (e && e.preventDefault) e.preventDefault();\n        const n = String(Math.floor(1000 + Math.random() * 9000));\n        this.setState({ grmSent: true, grmRef: \"TASFAM-GRM-2026-\" + n });\n        if (typeof window !== \"undefined\") window.scrollTo(0, 0);\n      },\n      ...this.lensVals()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
